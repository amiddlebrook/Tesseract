name: Cloudflare CI/CD
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tesseract-cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy:
    name: Deploy to Cloudflare Workers
    needs: verify
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Require Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }
      - name: Deploy with Wrangler
        run: |
          npm ci
          npm run build
          npx --yes wrangler@4.45.0 deploy
      - name: Production smoke test
        env:
          BASE_URL: https://tesseract-grid-os.averymiddlebrook2014.workers.dev
        run: |
          set -euo pipefail
          echo "Checking deployed HTML..."
          curl --retry 12 --retry-delay 3 --retry-all-errors --max-time 15 --fail-with-body -sS "$BASE_URL/" -o /tmp/tesseract-home.html
          grep -q "Tesseract" /tmp/tesseract-home.html
          echo "Checking deployed Worker health..."
          curl --retry 12 --retry-delay 3 --retry-all-errors --max-time 15 --fail-with-body -sS "$BASE_URL/api/health" -o /tmp/tesseract-health.json
          node -e "const h=require('/tmp/tesseract-health.json'); if (h.status !== 'ok' || h.service !== 'Tesseract Edge') process.exit(1); console.log('Health OK:', h.edge);"
          echo "Checking live event processing..."
          curl --retry 5 --retry-delay 3 --retry-all-errors --max-time 15 --fail-with-body -sS -X POST "$BASE_URL/api/pipeline/run" -H 'Content-Type: application/json' --data '{"event":{"id":"ci-smoke","source":"github-actions","type":"deployment.smoke","severity":"critical","message":"Smoke test"}}' -o /tmp/tesseract-run.json
          node -e "const r=require('/tmp/tesseract-run.json'); if (r.score !== 95 || r.route !== 'priority-alerts' || r.trace?.length !== 4) process.exit(1); console.log('Pipeline OK:', r.runId);"
          echo "All production smoke tests passed."
